name: continuous integration build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true                     # Disable the .NET logo
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true # Disable the .NET first time experience
  DOTNET_CLI_TELEMETRY_OPTOUT: true       # Disable sending .NET CLI telemetry
  DOTNET_VERSION: '10.0.x'                # .NET version to use
  XCODE_VERSION: '26.6'                   # must satisfy the .NET for iOS workload, which requires 26.6
  IOS_FRAMEWORK: 'net10.0-ios'            # iOS framework target
  ANDROID_FRAMEWORK: 'net10.0-android'    # Android framework target

jobs:
# Unit Tests (plain net10.0 test project — no MAUI workload required)
  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:

      - name: Checkout
        uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8

      - name: Setup .NET
        uses: actions/setup-dotnet@4d4a70f4a5b2a5a5329f13be4ac933f2c9206ac0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Test Dependencies
        run: dotnet restore tests/IfpaMaui.Tests/IfpaMaui.Tests.csproj

      - name: Run Unit Tests
        run: dotnet test tests/IfpaMaui.Tests/IfpaMaui.Tests.csproj -c Release --no-restore --verbosity normal

# MAUI Android Build
  build-android:
    runs-on: windows-2022
    name: Android Build
    steps:

      - name: Checkout
        uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8

      - name: Setup .NET
        uses: actions/setup-dotnet@4d4a70f4a5b2a5a5329f13be4ac933f2c9206ac0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Install MAUI Workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Restore Dependencies
        run: dotnet restore src/IfpaMaui/IfpaMaui.csproj

      - name: Build MAUI Android
        run: dotnet build src/IfpaMaui/IfpaMaui.csproj -c Release -f ${{ env.ANDROID_FRAMEWORK }} --no-restore

# MAUI iOS Build
  build-ios:
    runs-on: macos-26
    name: iOS Build
    environment: Release
    env:
      # Fork PRs receive no repository or environment secrets, so the signing
      # material below arrives empty for them. Those runs build unsigned against
      # the simulator instead: enough to catch compile errors without exposing
      # the distribution cert to code that has not been reviewed yet.
      IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
    steps:

      - name: Checkout
        uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8

      - name: Setup .NET
        uses: actions/setup-dotnet@4d4a70f4a5b2a5a5329f13be4ac933f2c9206ac0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI Workload
        run: dotnet workload install ios maui --source https://api.nuget.org/v3/index.json

      - name: Restore Dependencies
        run: dotnet restore src/IfpaMaui/IfpaMaui.csproj

      - name: Install the Apple certificate and provisioning profile
        if: env.IS_FORK != 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PW }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.DISTRIBUTION_PROVISION_PROFILE_BASE64 }}
          DISTRIBUTION_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.DISTRIBUTION_WIDGET_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}         
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          WIDGET_PP_PATH=$RUNNER_TEMP/widget_pp.mobileprovision
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          echo -n "$DISTRIBUTION_WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode -o $WIDGET_PP_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
          WIDGET_PROFILE_UUID=$(grep -aA1 UUID $WIDGET_PP_PATH | grep -io "[-A-F0-9]\{36\}" | head -1)
          if [[ -z "$WIDGET_PROFILE_UUID" ]]; then
              echo "❌ Failed to extract UUID from widget provisioning profile"
              exit 1
          fi
          cp $WIDGET_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$WIDGET_PROFILE_UUID.mobileprovision
          echo "WIDGET_PROVISIONING_UUID=$WIDGET_PROFILE_UUID" >> $GITHUB_ENV
                   
      - name: Use Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Download iOS platform + simulators if missing
      - name: Install iOS platform + simulator runtime
        run: |
          # `xcodebuild -downloadPlatform` fails intermittently on the runners
          # with "Unable to connect to simulator." and exit 70. The SDK needed
          # to build ships with Xcode, so this is best effort. Fail only when
          # the SDK is really missing.
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then break; fi
            echo "downloadPlatform iOS attempt $attempt did not succeed"
            sleep 15
          done
          xcrun simctl list runtimes || true
          if ! xcodebuild -showsdks | grep -qi iphonesimulator; then
            echo "No iOS simulator SDK is available"
            exit 1
          fi

      - name: Build RankWidgetExtension
        if: env.IS_FORK != 'true'
        run: |
          xcodebuild \
            -project src/IfpaMaui/NativeIFPA/IFPA.xcodeproj \
            -scheme RankWidgetExtension \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath src/IfpaMaui/NativeIFPA/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution: Ed Giardina (KH5JKUPW2Q)" \
            CODE_SIGN_ENTITLEMENTS=RankWidgetExtension.entitlements \
            DEVELOPMENT_TEAM=KH5JKUPW2Q \
            PROVISIONING_PROFILE="$WIDGET_PROVISIONING_UUID"             

      - name: Build RankWidgetExtension (unsigned, simulator)
        if: env.IS_FORK == 'true'
        run: |
          xcodebuild \
            -project src/IfpaMaui/NativeIFPA/IFPA.xcodeproj \
            -scheme RankWidgetExtension \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            -derivedDataPath src/IfpaMaui/NativeIFPA/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build MAUI iOS
        if: env.IS_FORK != 'true'
        run: dotnet build src/IfpaMaui/IfpaMaui.csproj -c Release -f ${{ env.IOS_FRAMEWORK }} -p:ArchiveOnBuild=true

      # IfpaMaui.csproj pins RuntimeIdentifier=ios-arm64 and ArchiveOnBuild for
      # the iOS Release configuration. Override both so the build targets the
      # simulator, where no signing identity is needed. That also flips
      # ComputedPlatform to iPhoneSimulator, so AdditionalAppExtensions reads the
      # widget from DerivedData/Build/Products/Release-iphonesimulator above.
      - name: Build MAUI iOS (unsigned, simulator)
        if: env.IS_FORK == 'true'
        run: >
          dotnet build src/IfpaMaui/IfpaMaui.csproj -c Release -f ${{ env.IOS_FRAMEWORK }}
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:ArchiveOnBuild=false
