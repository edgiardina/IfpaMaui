name: release to App Store

# Manual only. Takes an iOS build that publish.yml already uploaded to TestFlight and releases it on
# the App Store: it creates the App Store version, attaches the build, sets "What's New", and submits
# for review. It never runs on a push or a tag. The mobile-release skill starts it with
# `gh workflow run` after Ed approves the version and the release notes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (for example 3.4.12). publish.yml must already have built it."
        required: true
      buildNumber:
        description: "Build number = 1000 + the publish.yml run_number (the iOS CFBundleVersion)."
        required: true
      releaseNotes:
        description: "What's New text. Pass a file: gh workflow run ... -F releaseNotes=@notes.txt"
        required: true
      submitForReview:
        description: "Submit for App Review (default). Set false for a dry run that only stages the version and What's New."
        type: boolean
        default: true

jobs:
  ios:
    runs-on: ubuntu-latest   # deliver uses only the App Store Connect API, so no Xcode is necessary
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install fastlane
        run: gem install fastlane --no-document
      - name: Release ${{ inputs.version }} (${{ inputs.buildNumber }}) to the App Store (submit=${{ inputs.submitForReview }})
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          RELEASE_VERSION: ${{ inputs.version }}
          IOS_BUILD_NUMBER: ${{ inputs.buildNumber }}
          RELEASE_NOTES: ${{ inputs.releaseNotes }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submitForReview }}
        run: fastlane ios appstore_release version:"${{ inputs.version }}"
