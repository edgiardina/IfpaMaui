name: publish signed mobile artifacts
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
        versionNumber:
          description: 'version number'     
          required: true
          default: '0.1.1'

env:
  DOTNET_NOLOGO: true                     # Disable the .NET logo
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true # Disable the .NET first time experience
  DOTNET_CLI_TELEMETRY_OPTOUT: true       # Disable sending .NET CLI telemetry
  DOTNET_VERSION: '10.0.x'                # .NET version to use
  XCODE_VERSION: '26.5'                   # Xcode version that supports iOS 26 for dotnet maui build
  IOS_FRAMEWORK: 'net10.0-ios'            # iOS framework target
  ANDROID_FRAMEWORK: 'net10.0-android'    # Android framework target
  
jobs:
  publish-android:
    runs-on: windows-2022
    name: Android Build
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Pull Version from Tag
        uses: nowsprinting/check-version-format-action@v3
        id: version
        with:
          prefix: 'v'
      
      - name: Use Version From Tag
        shell: bash
        if: steps.version.outputs.is_valid == 'true'
        run: |          
              echo "VERSION=${{steps.version.outputs.full_without_prefix}}" >> $GITHUB_ENV          
              echo "${VERSION} is our version number"
          
      - name: Use Version from User Input
        shell: bash
        if: steps.version.outputs.is_valid == 'false'
        run: |
              echo "VERSION=${{github.event.inputs.versionNumber}}" >> $GITHUB_ENV        
              echo "${VERSION} is our version number"  
              
      - name: create a custom version using run number offset by 1000 (run_number + 1000)
        shell: bash
        run: |
          echo "VERSION_NUMBER_WITH_OFFSET=$((1000+GITHUB_RUN_NUMBER))" >> $GITHUB_ENV

      - name: App Settings Variable Substitution
        uses: microsoft/variable-substitution@v1
        with:
          files: 'src/IfpaMaui/appsettings.json'
        env:
          AppSettings.IfpaApiKey: ${{ secrets.IFPA_API_KEY }}
      
      - name: Add Google Maps API Key to Android Manifest
        run: |
          $pathToXml = "src/IfpaMaui/Platforms/Android/AndroidManifest.xml"
          $xml=[xml](Get-Content $pathToXml)
          $xml.manifest.application."meta-data".value = "${{ secrets.GOOGLE_MAPS_API_KEY }}"
          $xml.Save($pathToXml)       
       
        # # Store Android Signing Keystore and password in Secrets using base64 encoding
        # # https://docs.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
        # # commandline util to encode to base64 on windows
      - name: Setup Keystore File
        run: |
          echo "${{ secrets.IFPA_ANDROID_KEYSTORE }}" > ifpamaui.keystore.asc
          certutil -decode ifpamaui.keystore.asc ifpa-keystore.jks

      - name: Setup .NET
        uses: actions/setup-dotnet@4d4a70f4a5b2a5a5329f13be4ac933f2c9206ac0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Install MAUI Workload
        run: dotnet workload install maui android

      - name: Restore Dependencies
        run: dotnet restore src/IfpaMaui/IfpaMaui.csproj

      - name: Build MAUI Android
        run: dotnet publish src/IfpaMaui/IfpaMaui.csproj -c Release -f ${{ env.ANDROID_FRAMEWORK }} -p:Version=$Env:VERSION -p:ApplicationDisplayVersion=$Env:VERSION -p:ApplicationVersion=${{ env.VERSION_NUMBER_WITH_OFFSET }} --no-restore -p:AndroidKeyStore=True /p:AndroidSigningKeyStore=${{ github.workspace }}/ifpa-keystore.jks /p:AndroidSigningKeyAlias=upload /p:AndroidSigningKeyPass="${{ secrets.IFPA_ANDROID_KEYSTORE_PASSWORD }}" /p:AndroidSigningStorePass="${{ secrets.IFPA_ANDROID_KEYSTORE_PASSWORD }}" --no-restore

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ifpamaui-android-signed-build
          path: src/IfpaMaui/bin/Release/${{ env.ANDROID_FRAMEWORK }}/publish/com.edgiardina.ifpa-Signed.aab

      - name: Deploy to Google Play (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.edgiardina.ifpa
          releaseFiles: src/IfpaMaui/bin/Release/${{ env.ANDROID_FRAMEWORK }}/publish/com.edgiardina.ifpa-Signed.aab
          releaseName: ${{ env.VERSION }}
          track: production

  publish-ios: 
    runs-on: macos-26
    environment: Release
    name: iOS Build
    steps:

      - uses: actions/checkout@v2

      - name: Install the Apple certificate and provisioning profiles
        env:
            BUILD_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERT_BASE64 }}
            P12_PASSWORD: ${{ secrets.DISTRIBUTION_CERT_PW }}
            BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.DISTRIBUTION_PROVISION_PROFILE_BASE64 }}
            DISTRIBUTION_WIDGET_PROVISION_PROFILE_BASE64: ${{ secrets.DISTRIBUTION_WIDGET_PROVISION_PROFILE_BASE64 }}
            DISTRIBUTION_WATCH_PROVISION_PROFILE_BASE64: ${{ secrets.DISTRIBUTION_WATCH_PROVISION_PROFILE_BASE64 }}
            DISTRIBUTION_WATCH_COMPLICATION_PROVISION_PROFILE_BASE64: ${{ secrets.DISTRIBUTION_WATCH_COMPLICATION_PROVISION_PROFILE_BASE64 }}
            KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            APP_PP_PATH=$RUNNER_TEMP/app_pp.mobileprovision
            WIDGET_PP_PATH=$RUNNER_TEMP/widget_pp.mobileprovision
            KEYCHAIN_PATH=$HOME/Library/Keychains/app-signing.keychain-db

            # Decode cert and both provisioning profiles
            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $APP_PP_PATH
            echo -n "$DISTRIBUTION_WIDGET_PROVISION_PROFILE_BASE64" | base64 --decode -o $WIDGET_PP_PATH

            # Create and unlock custom keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            # Import cert with access for codesign and security
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/security

            # Set keychain search and default to make it visible to MSBuild
            security list-keychains -s $KEYCHAIN_PATH login.keychain-db
            security default-keychain -s $KEYCHAIN_PATH

            # Grant signing tools access to the private key
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            # OPTIONAL: Try to trust the certificate globally
            CERT_SHA=$(security find-certificate -c "Apple Distribution" -Z $KEYCHAIN_PATH | awk '/SHA-1/ { print $NF }')
            if [[ -n "$CERT_SHA" ]]; then
                CERT_PATH=$(security find-certificate -Z -a -p $KEYCHAIN_PATH | awk 'BEGIN {p=0} /BEGIN CERTIFICATE/ {p=1} {if(p)print} /END CERTIFICATE/ {p=0}' > temp_cert.cer && echo "temp_cert.cer")
                sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$CERT_PATH" || echo "⚠️ Could not trust cert — continuing anyway"
            fi

            # ✅ Install main app provisioning profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            APP_PROFILE_UUID=$(grep -aA1 UUID $APP_PP_PATH | grep -io "[-A-F0-9]\{36\}" | head -1)
            if [[ -z "$APP_PROFILE_UUID" ]]; then
                echo "❌ Failed to extract UUID from main app provisioning profile"
                exit 1
            fi
            cp $APP_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$APP_PROFILE_UUID.mobileprovision
            echo "PROVISIONING_UUID=$APP_PROFILE_UUID" >> $GITHUB_ENV

            # ✅ Install widget provisioning profile
            WIDGET_PROFILE_UUID=$(grep -aA1 UUID $WIDGET_PP_PATH | grep -io "[-A-F0-9]\{36\}" | head -1)
            if [[ -z "$WIDGET_PROFILE_UUID" ]]; then
                echo "❌ Failed to extract UUID from widget provisioning profile"
                exit 1
            fi
            cp $WIDGET_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$WIDGET_PROFILE_UUID.mobileprovision
            echo "WIDGET_PROVISIONING_UUID=$WIDGET_PROFILE_UUID" >> $GITHUB_ENV

            # Install the two watch provisioning profiles when they exist.
            # They are optional so that iOS releases keep working before the
            # watch App IDs are created in the developer portal.
            if [[ -n "$DISTRIBUTION_WATCH_PROVISION_PROFILE_BASE64" ]]; then
                WATCH_PP_PATH=$RUNNER_TEMP/watch_pp.mobileprovision
                COMP_PP_PATH=$RUNNER_TEMP/watch_complication_pp.mobileprovision
                echo -n "$DISTRIBUTION_WATCH_PROVISION_PROFILE_BASE64" | base64 --decode -o $WATCH_PP_PATH
                echo -n "$DISTRIBUTION_WATCH_COMPLICATION_PROVISION_PROFILE_BASE64" | base64 --decode -o $COMP_PP_PATH

                for pair in "WATCH:$WATCH_PP_PATH" "WATCH_COMPLICATION:$COMP_PP_PATH"; do
                    NAME="${pair%%:*}"
                    PP="${pair#*:}"
                    UUID=$(grep -aA1 UUID "$PP" | grep -io "[-A-F0-9]\{36\}" | head -1)
                    if [[ -z "$UUID" ]]; then
                        echo "❌ Failed to extract UUID from $NAME provisioning profile"
                        exit 1
                    fi
                    cp "$PP" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
                    echo "${NAME}_PP_PATH=$PP" >> $GITHUB_ENV
                done
                echo "HAS_WATCH=true" >> $GITHUB_ENV
                echo "✅ Watch provisioning profiles installed"
            else
                echo "HAS_WATCH=false" >> $GITHUB_ENV
                echo "ℹ️ No watch provisioning profile secret, skipping the watch app"
            fi

            # Debug output to confirm identity is available
            echo "🔍 Signing identities:"
            security find-identity -v -p codesigning $KEYCHAIN_PATH
      
      - name: Pull Version from Tag
        uses: nowsprinting/check-version-format-action@v3
        id: version
        with:
          prefix: 'v'
      
      - name: Use Version From Tag
        shell: bash
        if: steps.version.outputs.is_valid == 'true'
        run: |          
              echo "VERSION=${{steps.version.outputs.full_without_prefix}}" >> $GITHUB_ENV          
              echo "${VERSION} is our version number"
          
      - name: Use Version from User Input
        shell: bash
        if: steps.version.outputs.is_valid == 'false'
        run: |
              echo "VERSION=${{github.event.inputs.versionNumber}}" >> $GITHUB_ENV        
              echo "${VERSION} is our version number"
          
      - name: create a custom version using run number offset by 1000 (run_number + 1000)
        run: |
          echo "VERSION_NUMBER_WITH_OFFSET=$((1000+GITHUB_RUN_NUMBER))" >> $GITHUB_ENV   
          
      - name: App Settings Variable Substitution
        uses: microsoft/variable-substitution@v1
        with:
          files: 'src/IfpaMaui/appsettings.json'
        env:
          AppSettings.IfpaApiKey: ${{ secrets.IFPA_API_KEY }}

      - name: Update Widget API key in Info.plist
        env:
            BUILD_NUMBER: ${{ env.VERSION_NUMBER_WITH_OFFSET }}
            APP_VERSION: ${{ env.VERSION }}
            IFPA_API_KEY: ${{ secrets.IFPA_API_KEY }}
        run: |
                WIDGET_PLIST="src/IfpaMaui/NativeIFPA/RankWidget/Info.plist"

                echo "🔐 Replacing IFPAApiKey"
                /usr/libexec/PlistBuddy -c "Set :IFPAApiKey $IFPA_API_KEY" "$WIDGET_PLIST" || \
                /usr/libexec/PlistBuddy -c "Add :IFPAApiKey string $IFPA_API_KEY" "$WIDGET_PLIST"
    
      - name: Use Xcode Version For Widget Build
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Download iOS platform + simulators if missing
      - name: Install iOS platform + simulator runtime
        run: |
          xcodebuild -downloadPlatform iOS
          xcrun simctl list runtimes                

      - name: Build RankWidgetExtension
        run: |
          xcodebuild \
            -project src/IfpaMaui/NativeIFPA/IFPA.xcodeproj \
            -scheme RankWidgetExtension \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath src/IfpaMaui/NativeIFPA/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution: Ed Giardina (KH5JKUPW2Q)" \
            CODE_SIGN_ENTITLEMENTS=RankWidgetExtension.entitlements \
            DEVELOPMENT_TEAM=KH5JKUPW2Q \
            PROVISIONING_PROFILE="$WIDGET_PROVISIONING_UUID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION_NUMBER_WITH_OFFSET"  

      - name: Update watch API keys in Info.plist
        if: env.HAS_WATCH == 'true'
        env:
            IFPA_API_KEY: ${{ secrets.IFPA_API_KEY }}
        run: |
                echo "Replacing IFPAApiKey for the watch app and complication"
                for PLIST in "src/IfpaMaui/NativeIFPA/RankComplication/Info.plist" \
                             "src/IfpaMaui/NativeIFPA/IFPAWatch/Info.plist"; do
                    /usr/libexec/PlistBuddy -c "Set :IFPAApiKey $IFPA_API_KEY" "$PLIST" || \
                    /usr/libexec/PlistBuddy -c "Add :IFPAApiKey string $IFPA_API_KEY" "$PLIST"
                done

      - name: Install watchOS platform
        if: env.HAS_WATCH == 'true'
        run: xcodebuild -downloadPlatform watchOS

      # Built unsigned on purpose. The watch app and its extension have
      # different bundle ids, so signing them here would mean threading two
      # provisioning profiles through one xcodebuild invocation. They are
      # signed inside-out in the embed step instead.
      - name: Build IFPAWatch
        if: env.HAS_WATCH == 'true'
        run: |
          xcodebuild \
            -project src/IfpaMaui/NativeIFPA/IFPA.xcodeproj \
            -scheme IFPAWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS' \
            -sdk watchos \
            -derivedDataPath src/IfpaMaui/NativeIFPA/WatchDD \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=KH5JKUPW2Q \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION_NUMBER_WITH_OFFSET"

      - name: Setup .NET
        uses: actions/setup-dotnet@4d4a70f4a5b2a5a5329f13be4ac933f2c9206ac0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The following command is due to some sort of maui build bug and iOS won't accept the binary:
      # run: dotnet workload install ios maui --source https://api.nuget.org/v3/index.json --version 8.0.401
      # ITMS-91017: Invalid SDK usage - The following frameworks aren't permitted for apps using an alternative web browser engine: [BrowserEngineKit]. 
      - name: Install MAUI Workload
        run: dotnet workload install ios maui --source https://api.nuget.org/v3/index.json
    
      - name: Restore nuget packages
        run:  dotnet restore src/IfpaMaui/IfpaMaui.csproj        
        
      - name : Publish iOS App
        shell: bash
        run: |
          dotnet publish src/IfpaMaui/IfpaMaui.csproj -f ${{ env.IOS_FRAMEWORK }} -c Release \
            -p:ArchiveOnBuild=true \
            -p:Version=${VERSION} \
            -p:ApplicationDisplayVersion=${VERSION} \
            -p:ApplicationVersion=${{ env.VERSION_NUMBER_WITH_OFFSET }} \
            -p:CodesignKey="iPhone Distribution: Ed Giardina (KH5JKUPW2Q)" \
            -p:ProvisioningProfileUuid=${{ env.PROVISIONING_UUID }}

      # MAUI has no hook for embedding a nested watch app, so this happens
      # after the archive is produced. Order matters: every nested bundle is
      # signed before the bundle that contains it, and the outer app is signed
      # last so its CodeResources covers the new Watch directory.
      - name: Embed the watch app into the IPA
        if: env.HAS_WATCH == 'true'
        env:
          SIGN_IDENTITY: "iPhone Distribution: Ed Giardina (KH5JKUPW2Q)"
        run: |
          set -euo pipefail

          IPA="src/IfpaMaui/bin/Release/${{ env.IOS_FRAMEWORK }}/ios-arm64/publish/IfpaMaui.ipa"
          WATCH_APP="src/IfpaMaui/NativeIFPA/WatchDD/Build/Products/Release-watchos/IFPAWatch.app"

          test -f "$IPA" || { echo "❌ No IPA at $IPA"; exit 1; }
          test -d "$WATCH_APP" || { echo "❌ No watch app at $WATCH_APP"; exit 1; }

          WORK=$RUNNER_TEMP/ipa-work
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$IPA" -d "$WORK"

          APP_DIR=$(find "$WORK/Payload" -maxdepth 1 -name "*.app" | head -1)
          echo "📦 Outer app: $APP_DIR"

          # Reuse the entitlements the publish step already signed with, so the
          # re-sign cannot silently drop one.
          codesign -d --entitlements :"$RUNNER_TEMP/ios_entitlements.plist" "$APP_DIR"

          STAGED="$WORK/IFPAWatch.app"
          cp -R "$WATCH_APP" "$STAGED"

          cp "$WATCH_PP_PATH" "$STAGED/embedded.mobileprovision"
          cp "$WATCH_COMPLICATION_PP_PATH" "$STAGED/PlugIns/RankComplication.appex/embedded.mobileprovision"

          echo "🔏 Signing the complication"
          codesign --force --timestamp=none --sign "$SIGN_IDENTITY" \
            --entitlements src/IfpaMaui/NativeIFPA/RankComplication/RankComplication.entitlements \
            "$STAGED/PlugIns/RankComplication.appex"

          echo "🔏 Signing the watch app"
          codesign --force --timestamp=none --sign "$SIGN_IDENTITY" \
            --entitlements src/IfpaMaui/NativeIFPA/IFPAWatch/IFPAWatch.entitlements \
            "$STAGED"

          mkdir -p "$APP_DIR/Watch"
          rm -rf "$APP_DIR/Watch/IFPAWatch.app"
          mv "$STAGED" "$APP_DIR/Watch/IFPAWatch.app"

          echo "🔏 Re-signing the outer app"
          codesign --force --timestamp=none --sign "$SIGN_IDENTITY" \
            --entitlements "$RUNNER_TEMP/ios_entitlements.plist" \
            "$APP_DIR"

          echo "✅ Verifying"
          codesign --verify --strict "$APP_DIR/Watch/IFPAWatch.app/PlugIns/RankComplication.appex"
          codesign --verify --strict "$APP_DIR/Watch/IFPAWatch.app"
          codesign --verify --strict "$APP_DIR"

          ( cd "$WORK" && rm -f "$RUNNER_TEMP/repacked.ipa" && zip -qry "$RUNNER_TEMP/repacked.ipa" Payload )
          mv "$RUNNER_TEMP/repacked.ipa" "$IPA"
          echo "📦 Watch app embedded and IPA repacked"

      - uses: actions/upload-artifact@v4
        with:
          name: ifpamaui-ios-signed-build
          if-no-files-found: error
          path: |
            src/IfpaMaui/bin/Release/${{ env.IOS_FRAMEWORK }}/**/*.ipa

      - name: Upload app to App Store Connect
        env:
          APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
          APP_STORE_CONNECT_PASSWORD: ${{ secrets.APP_STORE_CONNECT_PASSWORD }}
        run: |
          xcrun altool --upload-app -t ios -f "src/IfpaMaui/bin/Release/${{ env.IOS_FRAMEWORK }}/ios-arm64/publish/IfpaMaui.ipa" -u "$APP_STORE_CONNECT_USERNAME" -p "$APP_STORE_CONNECT_PASSWORD"